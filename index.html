<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de empleo · Diseño</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#16182c;--muted:#5a5e7c;--line:#d9dbe8;--acc:#2548d8;--new:#0d7a4a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10111f;--card:#191b30;--ink:#eceefb;--muted:#a3a7cc;--line:#2d3058;--acc:#8aa0ff;--new:#5fd6a0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:60rem;margin:0 auto;padding:1.25rem}
h1{font-size:1.7rem;margin:.5rem 0 .25rem}
h2{font-size:1.1rem;margin:2rem 0 .75rem}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}
input,select{font:inherit;padding:.55rem .75rem;border:1px solid var(--line);border-radius:.5rem;background:var(--card);color:var(--ink)}
input{flex:1;min-width:12rem}
ul.l{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.job{background:var(--card);border:1px solid var(--line);border-radius:.7rem;padding:.9rem 1rem}
.job a{color:var(--ink);font-weight:600;text-decoration:none}
.job a:hover{color:var(--acc);text-decoration:underline}
.meta{font-size:.9rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.25rem .9rem;margin-top:.2rem}
.tag{font-size:.78rem;border:1px solid var(--line);border-radius:1rem;padding:0 .55rem}
.tag.n{color:var(--new);border-color:var(--new);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.75rem}
.role{background:var(--card);border:1px solid var(--line);border-radius:.7rem;padding:.8rem 1rem}
.role b{display:block;margin-bottom:.3rem}
.role a{margin-right:.8rem;color:var(--acc);font-size:.92rem}
.empty{padding:1.5rem;border:1px dashed var(--line);border-radius:.7rem;color:var(--muted)}
</style>
</head>
<body>
<div class="w">
  <h1>Radar de empleo</h1>
  <p class="muted" id="st">Cargando…</p>

  <h2>Ofertas detectadas</h2>
  <div class="bar">
    <input id="q" type="search" placeholder="Filtrar por título o empresa" aria-label="Filtrar">
    <select id="src" aria-label="Portal"><option value="">Todos los portales</option></select>
    <select id="mode" aria-label="Modalidad"><option value="">Barcelona y remoto</option><option value="r">Solo remoto</option><option value="b">Solo Barcelona</option></select>
  </div>
  <ul class="l" id="list"></ul>

  <h2>Búsquedas directas (últimas 24 h)</h2>
  <p class="muted">LinkedIn e Indeed no permiten consultarlos automáticamente. Estos enlaces abren cada búsqueda ya filtrada.</p>
  <div class="grid" id="links"></div>
</div>
<script>
var ROLES=["Product Designer","Diseñador UX/UI","Graphic Designer","Director de Arte","UX Designer","Visual Designer"];
var $=function(i){return document.getElementById(i)};
var DATA={jobs:[]};
function e(s){return encodeURIComponent(s)}
function ago(d){var m=Math.round((Date.now()-new Date(d))/6e4);if(m<60)return"hace "+Math.max(m,1)+" min";if(m<1440)return"hace "+Math.round(m/60)+" h";return"hace "+Math.round(m/1440)+" d"}
function links(){
  var g=$("links");g.textContent="";
  (DATA.roles||ROLES).forEach(function(r){
    var d=document.createElement("div");d.className="role";
    var b=document.createElement("b");b.textContent=r;d.appendChild(b);
    [["LinkedIn BCN","https://www.linkedin.com/jobs/search/?keywords="+e(r)+"&location="+e("Barcelona, Catalonia, Spain")+"&f_TPR=r86400&sortBy=DD"],
     ["LinkedIn remoto","https://www.linkedin.com/jobs/search/?keywords="+e(r)+"&location=Spain&f_WT=2&f_TPR=r86400&sortBy=DD"],
     ["Indeed BCN","https://es.indeed.com/jobs?q="+e(r)+"&l=Barcelona&fromage=1&sort=date"],
     ["Indeed remoto","https://es.indeed.com/jobs?q="+e(r+" remoto")+"&fromage=1&sort=date"],
     ["InfoJobs","https://www.infojobs.net/jobsearch/search-results/list.xhtml?keyword="+e(r)+"&provinceIds=9&sortBy=PUBLICATION_DATE"]
    ].forEach(function(l){var a=document.createElement("a");a.href=l[1];a.textContent=l[0];a.target="_blank";a.rel="noopener";d.appendChild(a)});
    g.appendChild(d);
  });
}
function render(){
  var q=$("q").value.toLowerCase(),s=$("src").value,m=$("mode").value,ul=$("list");ul.textContent="";
  var rows=DATA.jobs.filter(function(j){
    return(!q||(j.title+" "+j.company).toLowerCase().indexOf(q)>-1)&&(!s||j.source===s)&&(!m||(m==="r")===!!j.remote)});
  if(!rows.length){var p=document.createElement("div");p.className="empty";
    p.textContent=DATA.jobs.length?"Ninguna oferta coincide con los filtros.":"Aún no hay ofertas. Configura las claves de InfoJobs o Adzuna (ver README) y lanza la Action.";ul.appendChild(p);return}
  rows.slice(0,150).forEach(function(j){
    var li=document.createElement("li");li.className="job";
    var a=document.createElement("a");a.href=j.url;a.target="_blank";a.rel="noopener";a.textContent=j.title;
    var mt=document.createElement("div");mt.className="meta";
    var when=j.published||j.firstSeen;
    [j.company,j.place,j.source,ago(when)].filter(Boolean).forEach(function(t){var x=document.createElement("span");x.textContent=t;mt.appendChild(x)});
    if(j.remote){var r=document.createElement("span");r.className="tag";r.textContent="Remoto";mt.appendChild(r)}
    if(Date.now()-new Date(j.firstSeen)<36e5){var n=document.createElement("span");n.className="tag n";n.textContent="Nueva";mt.appendChild(n)}
    li.appendChild(a);li.appendChild(mt);ul.appendChild(li);
  });
}
function load(){
  fetch("jobs.json?t="+Date.now()).then(function(r){return r.json()}).then(function(d){
    DATA=d;
    var s=$("src"),cur=s.value;s.length=1;
    Array.from(new Set(d.jobs.map(function(j){return j.source}))).forEach(function(x){s.add(new Option(x,x))});s.value=cur;
    $("st").textContent=d.updated?"Última actualización: "+new Date(d.updated).toLocaleString("es-ES")+" · "+d.jobs.length+" ofertas guardadas · se refresca cada 15 min":"Sin datos todavía.";
    links();render();
  }).catch(function(){$("st").textContent="No se pudo cargar jobs.json.";links()});
}
["q","src","mode"].forEach(function(i){$(i).addEventListener("input",render)});
load();setInterval(load,9e5);
</script>
</body>
</html>
