<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de empleo</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#16182c;--muted:#5a5e7c;--line:#d9dbe8;--acc:#2548d8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10111f;--card:#191b30;--ink:#eceefb;--muted:#a3a7cc;--line:#2d3058;--acc:#8aa0ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:44rem;margin:0 auto;padding:1.25rem}
h1{font-size:1.6rem;margin:.5rem 0 .2rem}
.muted{color:var(--muted);font-size:.92rem}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input{width:100%;font:inherit;padding:.6rem .8rem;margin:1rem 0;border:1px solid var(--line);border-radius:.5rem;background:var(--card);color:var(--ink)}
ul{list-style:none;margin:0;padding:0}
#list{display:grid;gap:.7rem}
.co{background:var(--card);border:1px solid var(--line);border-radius:.7rem;padding:.8rem 1rem}
.co h2{font-size:1.05rem;margin:0 0 .3rem}
.co li{padding:.2rem 0}
a{color:var(--acc)}
.empty{padding:1.2rem;border:1px dashed var(--line);border-radius:.7rem;color:var(--muted)}
details{margin-top:2rem}
summary{cursor:pointer;color:var(--acc)}
details p{margin:.8rem 0 .3rem;font-weight:600}
details a{display:inline-block;margin-right:.9rem}
</style>
</head>
<body>
<div class="w">
  <h1>Radar de empleo</h1>
  <p class="muted" id="st">Cargando…</p>
  <input id="q" type="search" placeholder="Buscar empresa o puesto" aria-label="Buscar">
  <ul id="list"></ul>
  <details>
    <summary>Buscar directamente en LinkedIn, Indeed e InfoJobs</summary>
    <div id="links"></div>
  </details>
</div>
<script>
var ROLES=["Product Designer","Diseñador UX/UI","Graphic Designer","Director de Arte","UX Designer","Visual Designer"];
var $=function(i){return document.getElementById(i)},DATA={jobs:[]};
function e(s){return encodeURIComponent(s)}
function norm(t){return(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim()}
function ago(d){var m=Math.round((Date.now()-new Date(d))/6e4);if(m<60)return"hace "+Math.max(m,1)+" min";if(m<1440)return"hace "+Math.round(m/60)+" h";return"hace "+Math.round(m/1440)+" d"}
function links(){
  var g=$("links");g.textContent="";
  (DATA.roles||ROLES).forEach(function(r){
    var p=document.createElement("p");p.textContent=r;g.appendChild(p);
    [["LinkedIn","https://www.linkedin.com/jobs/search/?keywords="+e(r)+"&location="+e("Barcelona, Catalonia, Spain")+"&f_TPR=r86400&sortBy=DD"],
     ["Indeed","https://es.indeed.com/jobs?q="+e(r)+"&l=Barcelona&fromage=1&sort=date"],
     ["InfoJobs","https://www.infojobs.net/jobsearch/search-results/list.xhtml?keyword="+e(r)+"&provinceIds=9&sortBy=PUBLICATION_DATE"]
    ].forEach(function(l){var a=document.createElement("a");a.href=l[1];a.textContent=l[0];a.target="_blank";a.rel="noopener";g.appendChild(a)});
  });
}
function render(){
  var q=$("q").value.toLowerCase(),ul=$("list"),seen={},groups={};ul.textContent="";
  DATA.jobs.forEach(function(j){
    if(q&&(j.title+" "+j.company).toLowerCase().indexOf(q)<0)return;
    var k=norm(j.company)+"|"+norm(j.title);if(seen[k])return;seen[k]=1;
    var g=norm(j.company)||"-";(groups[g]=groups[g]||{name:j.company||"Empresa no indicada",items:[]}).items.push(j);
  });
  var list=Object.keys(groups).map(function(k){return groups[k]});
  if(!list.length){var d=document.createElement("div");d.className="empty";
    d.textContent=DATA.jobs.length?"Ninguna oferta coincide.":"Aún no hay ofertas. Configura las claves y lanza la Action (ver README).";ul.appendChild(d);return}
  list.slice(0,100).forEach(function(g){
    var c=document.createElement("li");c.className="co";
    var h=document.createElement("h2");h.textContent=g.name+" ("+g.items.length+")";c.appendChild(h);
    var u=document.createElement("ul");
    g.items.forEach(function(j){
      var li=document.createElement("li"),a=document.createElement("a");
      a.href=j.url;a.target="_blank";a.rel="noopener";a.textContent=j.title;li.appendChild(a);
      li.appendChild(document.createTextNode(" · "+(j.remote?"Remoto":j.place||"")+" · "+ago(j.published||j.firstSeen)));
      u.appendChild(li);
    });
    c.appendChild(u);ul.appendChild(c);
  });
}
function load(){
  fetch("jobs.json?t="+Date.now()).then(function(r){return r.json()}).then(function(d){
    DATA=d;$("st").textContent=d.updated?"Actualizado: "+new Date(d.updated).toLocaleString("es-ES"):"Sin datos todavía.";
    links();render();
  }).catch(function(){$("st").textContent="No se pudo cargar jobs.json.";links()});
}
$("q").addEventListener("input",render);
load();setInterval(load,9e5);
</script>
</body>
</html>
